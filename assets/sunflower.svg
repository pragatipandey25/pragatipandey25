<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark rounded badge background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <!-- Subtle warm border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Back Petal Gradient (warm amber-orange) -->
    <linearGradient id="petalDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Front Petal Gradient (sunny golden yellow with highlight) -->
    <linearGradient id="petalLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Center Seed Disc Radial Gradient -->
    <radialGradient id="centerDisk" cx="40%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="45%" stop-color="#451A03"/>
      <stop offset="85%" stop-color="#240D01"/>
      <stop offset="100%" stop-color="#140600"/>
    </radialGradient>

    <!-- Warm Golden Ambient Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

