<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="orbCyan" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#7c3aed" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .terminal-text { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .display-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .badge { rx: 6px; fill: #1e293b; fill-opacity: 0.65; stroke: #334155; stroke-width: 1px; }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#orbCyan)" />
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#orbPurple)" />

  <!-- Grid overlay -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#grid)" />

  <!-- Top Status Pill -->
  <g transform="translate(60, 42)">
    <rect width="265" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <circle cx="16" cy="15" r="8" fill="#10b981" fill-opacity="0.25" />
    <text x="32" y="19" class="terminal-text" font-size="12" fill="#94a3b8" letter-spacing="0.5">OPEN FOR HIGH-IMPACT ROLES</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="132" class="display-text" font-size="52" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">
    Pragati Pandey
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="172" class="display-text" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Software Development Engineer <tspan fill="#38bdf8">•</tspan> Full-Stack Architect <tspan fill="#818cf8">•</tspan> Applied AI Systems
  </text>

  <!-- Accent Line -->
  <line x1="60" y1="196" x2="1140" y2="196" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />

  <!-- Feature Pills / Badges -->
  <g transform="translate(60, 222)">
    <!-- Pill 1: Next.js & React -->
    <rect x="0" y="0" width="150" height="36" class="badge" />
    <text x="75" y="23" class="terminal-text" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Next.js / React</text>

    <!-- Pill 2: Applied AI & GenAI -->
    <rect x="165" y="0" width="160" height="36" class="badge" />
    <text x="245" y="23" class="terminal-text" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">🤖 Generative AI</text>

    <!-- Pill 3: Web Security -->
    <rect x="340" y="0" width="155" height="36" class="badge" />
    <text x="417" y="23" class="terminal-text" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">🔐 Web Security</text>

    <!-- Pill 4: Real-Time / WebSockets -->
    <rect x="510" y="0" width="155" height="36" class="badge" />
    <text x="587" y="23" class="terminal-text" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">⚡ Real-Time Stacks</text>

    <!-- Pill 5: 600+ DSA -->
    <rect x="680" y="0" width="150" height="36" class="badge" />
    <text x="755" y="23" class="terminal-text" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">🧠 600+ DSA Solved</text>
  </g>

  <!-- Decorative Corner Brackets -->
  <path d="M 1150 40 L 1170 40 L 1170 60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 1170 260 L 1170 280 L 1150 280" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" />
</svg>
